[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "litmus-client"
version = "0.1.0"
description = "Public Litmus CLI and HTTP SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "typing_extensions>=4.10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11,<1", "pyright>=1.1.407,<2"]
accounting = ["litmus-accounting>=0.3,<0.4"]
test = ["pytest>=8"]

[project.scripts]
litmus = "litmus.client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"litmus.client" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
