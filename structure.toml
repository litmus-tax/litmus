# Module map for litmus.client: the source of truth for scripts/structure.py.
# Layers are top-level packages (root modules are layers named by their stem);
# each lists the layers it may import. `layering = N` records that issue N
# tracks a module's import violations (its import check is skipped);
# `split_pending = N` records that issue N tracks splitting it past max_lines.

package = "litmus.client"
src = "pkg/src/litmus/client"
max_lines = 400

[layers]
__init__ = []
models = []
sdk = ["sdk", "models"]
cli = ["cli", "sdk", "models", "__init__"]

[modules]
"__init__.py" = { doc = "Package docstring and `__version__`." }
"models.py" = { doc = "Public wire shapes the client reads: problems, jobs, platform's device code and token grants." }
"sdk/client.py" = { doc = "The HTTP boundary to one deployment: relative `v1/` routes over one transport, non-2xx answers raised as problems." }
"sdk/jobs.py" = { doc = "Following a job by polling until it finishes, and walking `next_cursor` into one page." }
"sdk/auth.py" = { doc = "Platform's grants for the CLI: device flow, refresh and revocation of a login; claims decoded for display." }
"cli/app.py" = { doc = "The `litmus` entry point: the parser, common options, and problem JSON with exit codes." }
"cli/context.py" = { doc = "One invocation's arguments, connection, output, client and credential." }
"cli/connection.py" = { doc = "The deployment URL, tenant and portfolio from options, environment and `litmus.toml`." }
"cli/credentials.py" = { doc = "Credential stores per deployment URL: the OS keychain, or a 0600 file; locked for refreshes." }
"cli/session.py" = { doc = "The credential a command sends: `LITMUS_API_KEY`, a stored key or login, or the local owner key." }
"cli/output.py" = { doc = "Exact API bodies for machines, tables and fields for people, problems on error." }
"cli/auth.py" = { doc = "`litmus auth login|logout|status`." }
"cli/discovery.py" = { doc = "`litmus capabilities` and `litmus openapi <service>`." }
"cli/commands.py" = { doc = "The route command table: each command's words and the one public route it calls." }
"cli/index.py" = { doc = "The generated route index (`routes.json`): what each public route takes and answers." }
"cli/routes.py" = { doc = "Argparse parsers for route commands, with options generated from the index." }
"cli/body.py" = { doc = "Request bodies: options from body fields, `--body`, and `$VARIABLE` references." }
"cli/apply.py" = { doc = "`litmus apply`: unit resources, then portfolios with their accounts, from `litmus.toml`." }
"cli/invoke.py" = { doc = "Running a route command: path parameters and names to ids, query, pages, streams, jobs." }
"cli/local.py" = { doc = "`litmus local …`: thin wrappers running platform's `scripts/local.py` (Docker Compose)." }
