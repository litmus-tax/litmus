name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The public client depends on no other Litmus repository (policy 02 interfaces Rule 7.9).
jobs:
  checks:
    name: checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          path: litmus
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          python-version: '3.12'
          activate-environment: true
      - run: uv pip install -e 'litmus/pkg[dev]'
      - run: python scripts/check.py
        working-directory: litmus
      - run: python -m pytest pkg/tests -q
        working-directory: litmus
